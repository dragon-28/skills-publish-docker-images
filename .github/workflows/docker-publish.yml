name: Docker publish

on: 
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push docker img
        run: |
          docker build . --tag ghcr.io/dragon-28/skills-publish-docker-images/stackoverflown:main
          docker push ghcr.io/dragon-28/skills-publish-docker-images/stackoverflown:main
